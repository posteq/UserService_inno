spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5555/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:demo}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8082/.well-known/jwks.json}
